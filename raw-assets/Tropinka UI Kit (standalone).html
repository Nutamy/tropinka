document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"f9612690-d2ab-4037-b8ad-50f240a37b41\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"e8f8263d-e42e-4ba6-a7d4-90a390b52bfb\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"c4c399a9-e510-44b5-a994-f9c76016190c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #F7FBFD; font-family: 'Nunito', system-ui, sans-serif; color: #3B2A4A; -webkit-font-smoothing: antialiased; }\n  * { box-sizing: border-box; }\n  a { color: #135D5E; text-decoration: none; }\n  a:hover { color: #C02080; }\n  input, select, textarea, button { font-family: inherit; }\n  @keyframes tk-spin { to { transform: rotate(360deg); } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 40px 28px 100px;\">\n\n  <header style=\"display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; background: linear-gradient(160deg, #6AC6ED, #8FD6F2); border-radius: 32px; padding: 40px; color: #0F3D45; box-shadow: 0 18px 40px -22px rgba(31,143,144,.55);\">\n    <div style=\"display: flex; align-items: center; gap: 24px; flex-wrap: wrap;\">\n      <img src=\"9f3301e2-be34-445d-b4b3-e90c083ec4d9\" alt=\"Тропинка\" style=\"width: 132px; height: 132px; border-radius: 50%; background: #fff; box-shadow: 0 8px 24px -10px rgba(0,0,0,.35); flex: none;\">\n      <div style=\"min-width: 0;\">\n        <div style=\"font-family: 'Comfortaa', cursive; font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: #0F3D45; font-weight: 700;\">UI Kit · v1.0<\u002Fdiv>\n        <h1 style=\"font-family: 'Comfortaa', cursive; font-weight: 700; font-size: clamp(30px, 4.4vw, 48px); margin: 8px 0 10px; line-height: 1.1; color: #0B3138;\">Детский центр «Тропинка»<\u002Fh1>\n        <p style=\"margin: 0; font-size: 17px; max-width: 52ch; line-height: 1.5; color: #0F3D45; text-wrap: pretty;\">Библиотека компонентов, собранная из цветов логотипа: солнечно-жёлтый акцент, радужная семёрка букв и небесно-голубой фон.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"margin-top: 64px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px;\">\n      <span style=\"font-family: 'Comfortaa', cursive; font-size: 13px; font-weight: 700; color: #C02080; letter-spacing: .14em;\">01<\u002Fspan>\n      <h2 style=\"font-family: 'Comfortaa', cursive; font-size: 28px; font-weight: 700; margin: 0;\">Цвет<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 24px; color: #6E5C79; font-size: 15px;\">Голубой — основной фон и бренд. Радужные оттенки букв — акценты категорий; используйте не больше двух в одном экране.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 14px;\">\n      <sc-for list=\"{{ palette }}\" as=\"c\" hint-placeholder-count=\"8\">\n        <div style=\"border-radius: 20px; overflow: hidden; background: #fff; box-shadow: 0 8px 20px -16px rgba(59,42,74,.5); border: 1px solid #EAF2F7;\">\n          <div style=\"height: 84px; background: {{ c.hex }};\"><\u002Fdiv>\n          <div style=\"padding: 12px 14px 14px;\">\n            <div style=\"font-weight: 800; font-size: 14px;\">{{ c.name }}<\u002Fdiv>\n            <sc-if value=\"{{ showHex }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"font-family: ui-monospace, monospace; font-size: 12px; color: #8A7A94; margin-top: 3px;\">{{ c.hex }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"font-size: 12px; color: #8A7A94; margin-top: 6px; line-height: 1.35;\">{{ c.use }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 14px;\">\n      <div style=\"border-radius: 20px; padding: 18px 20px; background: #6AC6ED; color: #0F3D45;\">\n        <div style=\"font-weight: 800; font-size: 15px;\">Чернильный на голубом<\u002Fdiv>\n        <div style=\"font-size: 13px;\">Шапки и баннеры. Белый текст — только на морском #135D5E<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-radius: 20px; padding: 18px 20px; background: #FFD233; color: #5A3E12;\">\n        <div style=\"font-weight: 800; font-size: 15px;\">Тёмный на жёлтом<\u002Fdiv>\n        <div style=\"font-size: 13px;\">Кнопки-акценты, плашки «Новое»<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-radius: 20px; padding: 18px 20px; background: #F7FBFD; color: #3B2A4A; border: 1px solid #DCEBF3;\">\n        <div style=\"font-weight: 800; font-size: 15px;\">Основной текст<\u002Fdiv>\n        <div style=\"font-size: 13px; color: #6E5C79;\">#3B2A4A на #F7FBFD<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"margin-top: 64px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px;\">\n      <span style=\"font-family: 'Comfortaa', cursive; font-size: 13px; font-weight: 700; color: #C02080; letter-spacing: .14em;\">02<\u002Fspan>\n      <h2 style=\"font-family: 'Comfortaa', cursive; font-size: 28px; font-weight: 700; margin: 0;\">Типографика<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 24px; color: #6E5C79; font-size: 15px;\">Comfortaa — округлый шрифт заголовков, повторяет мягкие буквы логотипа. Nunito — текст и интерфейс.<\u002Fp>\n    <div style=\"background: #fff; border: 1px solid #EAF2F7; border-radius: 24px; padding: 28px 30px; display: grid; gap: 22px; box-shadow: 0 10px 30px -24px rgba(59,42,74,.6);\">\n      <sc-for list=\"{{ typeScale }}\" as=\"t\" hint-placeholder-count=\"5\">\n        <div style=\"display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; padding-bottom: 20px; border-bottom: 1px dashed #E6EFF5;\">\n          <div style=\"font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: .08em; color: #A093A8; text-transform: uppercase;\">{{ t.meta }}<\u002Fdiv>\n          <div style=\"font-family: {{ t.family }}; font-size: {{ t.size }}; font-weight: {{ t.weight }}; line-height: 1.25; color: #3B2A4A;\">{{ t.sample }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"margin-top: 64px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px;\">\n      <span style=\"font-family: 'Comfortaa', cursive; font-size: 13px; font-weight: 700; color: #C02080; letter-spacing: .14em;\">03<\u002Fspan>\n      <h2 style=\"font-family: 'Comfortaa', cursive; font-size: 28px; font-weight: 700; margin: 0;\">Кнопки<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin: 0 0 24px; color: #6E5C79; font-size: 15px;\">Пилюли с мягкой тенью. Основное действие — жёлтое, второе по важности — голубое, разрушающее — красное.<\u002Fp>\n    <div style=\"background: #fff; border: 1px solid #EAF2F7; border-radius: 24px; padding: 28px 30px; display: grid; gap: 26px;\">\n      <div style=\"display: grid; gap: 12px;\">\n        <div style=\"font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: .08em; color: #A093A8; text-transform: uppercase;\">Варианты<\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center;\">\n          <button style=\"border: none; cursor: pointer; padding: 14px 26px; border-radius: 999px; background: #FFD233; color: #4A3208; font-weight: 800; font-size: 15px; box-shadow: 0 8px 18px -10px rgba(214,164,0,.9);\" style-hover=\"background: #FFDC5C; transform: translateY(-1px);\" style-active=\"transform: translateY(1px);\">Записаться<\u002Fbutton>\n          <button style=\"border: none; cursor: pointer; padding: 14px 26px; border-radius: 999px; background: #135D5E; color: #fff; font-weight: 800; font-size: 15px; box-shadow: 0 8px 18px -10px rgba(19,93,94,.9);\" style-hover=\"background: #1B7576;\">Расписание<\u002Fbutton>\n          <button style=\"cursor: pointer; padding: 13px 25px; border-radius: 999px; background: #fff; color: #135D5E; font-weight: 800; font-size: 15px; border: 2px solid #BFE4E4;\" style-hover=\"border-color: #135D5E;\">Подробнее<\u002Fbutton>\n          <button style=\"border: none; cursor: pointer; padding: 14px 22px; border-radius: 999px; background: transparent; color: #802F80; font-weight: 800; font-size: 15px;\" style-hover=\"background: #F6ECF6;\">Отмена<\u002Fbutton>\n          <button style=\"border: none; cursor: pointer; padding: 14px 26px; border-radius: 999px; background: #E23430; color: #fff; font-weight: 800; font-size: 15px;\" style-hover=\"background: #F04A46;\">Удалить<\u002Fbutton>\n          <button disabled=\"true\" style=\"border: none; padding: 14px 26px; border-radius: 999px; background: #E9EFF3; color: #A9B6BF; font-weight: 800; font-size: 15px; cursor: not-allowed;\">Недоступно<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; gap: 12px;\">\n        <div style=\"font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: .08em; color: #A093A8; text-transform: uppercase;\">Размеры и иконки<\u002Fdiv>\n        <div style=\"display: f height: 34px; border-radius: 999px; background: {{ s.color }}; flex: none;\"><\u002Fspan>\n            <span style=\"min-width: 0;\">\n              <span style=\"display: block; font-weight: 800; font-size: 15px;\">{{ s.title }}<\u002Fspan>\n              <span style=\"display: block; font-size: 13px; color: #CFE9E9;\">{{ s.room }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"margin-top: 72px; padding-top: 26px; border-top: 1px dashed #DCEBF3; display: flex; gap: 16px; justify-content: space-between; align-items: center; flex-wrap: wrap; color: #8A7A94; font-size: 13px;\">\n    <span>UI Kit «Тропинка» · цвета и шрифты выведены из логотипа<\u002Fspan>\n    <span style=\"font-family: ui-monospace, monospace;\">Comfortaa · Nunito<\u002Fspan>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showHex&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Цвет&quot;},&quot;progress&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:68,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Состояния&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    checks: [true, false, true],\n    radio: 1,\n    sw: true,\n    tab: 0,\n    page: 2\n  };\n\n  renderVals() {\n    const st = this.state;\n    const prog = this.props.progress ?? 68;\n    const checkLabels = [\"Согласен с обработкой данных\", \"Нужен трансфер от метро\", \"Ребёнок посещал центр ранее\"];\n    const radioLabels = [\"Утренняя группа\", \"Дневная группа\", \"Вечерняя группа\"];\n    const tabLabels = [\"Программа\", \"Педагоги\", \"Отзывы\"];\n    const tabBodies = [\n      \"Восемь месяцев занятий: чтение, счёт, мелкая моторика и подготовка руки к письму. Два занятия в неделю по 55 минут.\",\n      \"С группой работают два педагога и логопед. Каждый педагог проходит supervision раз в месяц.\",\n      \"«Дочка идёт на занятия сама и ведёт меня за руку» — Ольга, мама Миры, 5 лет.\"\n    ];\n\n    return {\n      palette: [\n        { name: \"Небесный\", hex: \"#6AC6ED\", use: \"Фон бренда, шапки\" },\n        { name: \"Солнечный\", hex: \"#FFD233\", use: \"Главные кнопки\" },\n        { name: \"Красный\", hex: \"#E23430\", use: \"Ошибки, удаление\" },\n        { name: \"Оранжевый\", hex: \"#F0702F\", use: \"Акцент, прогресс\" },\n        { name: \"Оливковый\", hex: \"#8FA33F\", use: \"Категории\" },\n        { name: \"Зелёный\", hex: \"#2FA050\", use: \"Успех, свободные места\" },\n        { name: \"Морской\", hex: \"#1F8F90\", use: \"Второе действие, иконки\" },\n        { name: \"Морской тёмный\", hex: \"#135D5E\", use: \"Белый текст, ссылки\" },\n        { name: \"Сливовый\", hex: \"#802F80\", use: \"Текст логотипа, заголовки\" },\n        { name: \"Малиновый\", hex: \"#C02080\", use: \"Промо, новинки\" },\n        { name: \"Чернильный\", hex: \"#3B2A4A\", use: \"Основной текст\" }\n      ],\n      typeScale: [\n        { meta: \"Comfortaa 700 · 48/1.1 — H1\", family: \"'Comfortaa', cursive\", size: \"48px\", weight: \"700\", sample: \"Растём играя\" },\n        { meta: \"Comfortaa 700 · 28/1.2 — H2\", family: \"'Comfortaa', cursive\", size: \"28px\", weight: \"700\", sample: \"Программы и расписание\" },\n        { meta: \"Comfortaa 600 · 20/1.3 — H3\", family: \"'Comfortaa', cursive\", size: \"20px\", weight: \"600\", sample: \"Подготовка к школе\" },\n        { meta: \"Nunito 400 · 17/1.55 — Body\", family: \"'Nunito', sans-serif\", size: \"17px\", weight: \"400\", sample: \"Занятия проходят в малых группах до восьми детей, чтобы педагог успевал к каждому.\" },\n        { meta: \"Nunito 800 · 14/1.2 — UI / кнопки\", family: \"'Nunito', sans-serif\", size: \"14px\", weight: \"800\", sample: \"ЗАПИСАТЬСЯ НА ПРОБНОЕ\" },\n        { meta: \"Nunito 600 · 13/1.4 — Подпись\", family: \"'Nunito', sans-serif\", size: \"13px\", weight: \"600\", sample: \"Первое занятие бесплатно\" }\n      ],\n      checks: checkLabels.map((label, i) => ({\n        label,\n        tick: st.checks[i] ? \"✓\" : \"\",\n        bg: st.checks[i] ? \"#2FA050\" : \"#fff\",\n        border: st.checks[i] ? \"#2FA050\" : \"#DCEBF3\",\n        toggle: () => this.setState(s => {\n          const c = s.checks.slice();\n          c[i] = !c[i];\n          return { checks: c };\n        })\n      })),\n      radios: radioLabels.map((label, i) => ({\n        label,\n        border: st.radio === i ? \"#135D5E\" : \"#DCEBF3\",\n        dot: st.radio === i ? \"#135D5E\" : \"transparent\",\n        pick: () => this.setState({ radio: i })\n      })),\n      toggleSwitch: () => this.setState(s => ({ sw: !s.sw })),\n      switchBg: st.sw ? \"#2FA050\" : \"#D8E3EA\",\n      switchOffset: st.sw ? \"26px\" : \"0px\",\n      navItems: [\n        { label: \"Программы\", color: \"#fff\", bg: \"#135D5E\" },\n        { label: \"Педагоги\", color: \"#3B2A4A\", bg: \"transparent\" },\n        { label: \"Расписание\", color: \"#3B2A4A\", bg: \"transparent\" },\n        { label: \"Контакты\", color: \"#3B2A4A\", bg: \"transparent\" }\n      ],\n      tabs: tabLabels.map((label, i) => ({\n        label,\n        pick: () => this.setState({ tab: i }),\n        bg: st.tab === i ? \"#fff\" : \"transparent\",\n        color: st.tab === i ? \"#135D5E\" : \"#5F717C\",\n        shadow: st.tab === i ? \"0 6px 14px -10px rgba(31,143,144,.9)\" : \"none\"\n      })),\n      tabBody: tabBodies[st.tab],\n      steps: [\n        { n: \"1\", label: \"Заявка\", bg: \"#2FA050\", color: \"#fff\", textColor: \"#3B2A4A\" },\n        { n: \"2\", label: \"Знакомство\", bg: \"#FFD233\", color: \"#4A3208\", textColor: \"#3B2A4A\" },\n        { n: \"3\", label: \"Оплата\", bg: \"#EDF4F8\", color: \"#A0AEB8\", textColor: \"#A0AEB8\" }\n      ],\n      pages: [\"‹\", \"1\", \"2\", \"3\", \"›\"].map(label => ({\n        label,\n        bg: label === String(st.page) ? \"#6AC6ED\" : \"#F1F7FA\",\n        color: label === String(st.page) ? \"#fff\" : \"#5C6B75\"\n      })),\n      badges: [\n        { label: \"Новое\", bg: \"#FFD233\", color: \"#4A3208\" },\n        { label: \"Есть места\", bg: \"#E7F7EC\", color: \"#218040\" },\n        { label: \"Мало мест\", bg: \"#FDEDE6\", color: \"#A8410F\" },\n        { label: \"Набор закрыт\", bg: \"#FDECEC\", color: \"#C42B27\" },\n        { label: \"4–6 лет\", bg: \"#EAF6FB\", color: \"#135D5E\" },\n        { label: \"Хит сезона\", bg: \"#FDF0F7\", color: \"#C02080\" }\n      ],\n      chips: [\"Творчество\", \"Логика\", \"Английский\", \"Музыка\", \"Спорт\"],\n      alerts: [\n        { head: \"Запись подтверждена\", body: \"Ждём Миру во вторник в 10:00, кабинет «Солнышко».\", bg: \"#E7F7EC\", dot: \"#2FA050\", title: \"#1B6E37\" },\n        { head: \"Осталось два места\", body: \"Группа подготовки к школе почти заполнена.\", bg: \"#FFF7E0\", dot: \"#FFD233\", title: \"#7A5405\" },\n        { head: \"Оплата не прошла\", body: \"Проверьте данные карты или выберите другой способ.\", bg: \"#FDECEC\", dot: \"#E23430\", title: \"#A72622\" }\n      ],\n      showHex: this.props.showHex ?? true,\n      progress: prog,\n      progressWidth: prog + \"%\",\n      avatars: [\n        { i: \"М\", bg: \"#E23430\" },\n        { i: \"А\", bg: \"#F0702F\" },\n        { i: \"Л\", bg: \"#2FA050\" },\n        { i: \"К\", bg: \"#802F80\" }\n      ],\n      courses: [\n        { title: \"Творческая мастерская\", desc: \"Лепка, живопись и коллаж. Каждое занятие ребёнок уносит работу домой.\", age: \"3–5 лет\", price: \"от 900 ₽\", photo: \"фото занятия\", tint: \"#F0702F\", tint2: \"#F58A52\", tagBg: \"#FDEDE6\", tagColor: \"#A8410F\" },\n        { title: \"Подготовка к школе\", desc: \"Чтение, счёт и письмо в игровом формате, группы до восьми детей.\", age: \"5–7 лет\", price: \"от 1 200 ₽\", photo: \"фото класса\", tint: \"#1F8F90\", tint2: \"#35A6A7\", tagBg: \"#EAF6FB\", tagColor: \"#135D5E\" },\n        { title: \"Английский с песнями\", desc: \"Первые слова через музыку, движение и короткие истории.\", age: \"4–6 лет\", price: \"от 1 000 ₽\", photo: \"фото группы\", tint: \"#802F80\", tint2: \"#9B449B\", tagBg: \"#F6ECF6\", tagColor: \"#802F80\" }\n      ],\n      schedule: [\n        { time: \"10:00\", title: \"Творческая мастерская\", room: \"Кабинет «Солнышко»\", color: \"#FFD233\" },\n        { time: \"12:30\", title: \"Подготовка к школе\", room: \"Кабинет «Радуга»\", color: \"#2FA050\" },\n        { time: \"17:00\", title: \"Английский с песнями\", room: \"Кабинет «Тропинка»\", color: \"#C02080\" }\n      ]\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
